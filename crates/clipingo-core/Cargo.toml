[package]
name = "clipingo-core"
version.workspace = true
edition.workspace = true
license.workspace = true

[dependencies]
anyhow.workspace = true
# The OS's own TLS: nothing extra to ship (schannel on Windows, Security on macOS, OpenSSL on Linux).
reqwest = { version = "0.13.5", default-features = false, features = ["json", "native-tls", "http2"] }
serde.workspace = true
serde_json.workspace = true
tokio.workspace = true
# ONNX Runtime for the face detector (YuNet); the DLL is fetched at build time and copied next to the binaries.
ort = { version = "=2.0.0-rc.15", default-features = false, features = ["std", "download-binaries", "copy-dylibs", "tls-native", "api-31"] }
