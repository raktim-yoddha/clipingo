[workspace]
resolver = "3"
members = ["crates/clipingo-core", "crates/clipd", "crates/clip"]

[workspace.package]
version = "0.1.0"
edition = "2024"
license = "MIT"

[workspace.dependencies]
clipingo-core = { path = "crates/clipingo-core" }
anyhow = "1.0.104"
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.154"
tokio = { version = "1.54.1", features = ["rt-multi-thread", "macros", "process", "io-util", "net", "time", "fs"] }

# Shipped binaries: no debug symbols, cross-crate inlining.
[profile.release]
strip = true
lto = "fat"
codegen-units = 1

